name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key and local config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamable.jks"
          {
            echo "storeFile=$RUNNER_TEMP/streamable.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "STREAMABLE_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
          echo "$LOCAL_PROPERTIES_BASE64" | base64 -d > local.properties

      - name: Build full APK (all ABIs)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Streamable-${GITHUB_REF_NAME#v}.apk"

      - name: Build slim APK (armeabi-v7a, for 32-bit projectors)
        run: |
          ./gradlew :app:assembleRelease -PonlyAbi=armeabi-v7a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Streamable-${GITHUB_REF_NAME#v}-armeabi-v7a.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Streamable-*.apk \
            --title "Streamable ${GITHUB_REF_NAME#v}" --generate-notes
